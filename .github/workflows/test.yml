name: Static Site CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify HTML files and local references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          # These routes are intentionally advertised but not implemented yet.
          # Keep them visible as warnings instead of making unrelated CI unusable.
          planned = {
              'laser-ontharing.html', 'emsculpt.html',
              'style-minimal.html', 'style-luxury.html', 'style-bold.html'
          }
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  self.refs += [data[k] for k in ('href','src') if k in data]

          files=list(Path('.').glob('*.html'))
          if not files: raise SystemExit('No HTML files found')
          missing=[]
          for page in files:
              parser=Links(); parser.feed(page.read_text(encoding='utf-8')); parser.close()
              for ref in parser.refs:
                  if not ref or ref.startswith(('#','mailto:','tel:','http://','https://','data:','javascript:')): continue
                  target=urlsplit(ref).path.lstrip('/')
                  if target and not Path(target).exists():
                      if target in planned:
                          print(f'warning: planned route not implemented: {page}: {ref}')
                      else:
                          missing.append(f'{page}: {ref}')
          if missing: raise SystemExit('Missing unexpected local references:\n'+'\n'.join(missing))
          print(f'validated {len(files)} HTML files')
          PY

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint Markdown using repository policy
        run: npx --yes markdownlint-cli2@0.18.1 --config .markdownlint.json "**/*.md" "#CHANGELOG.md"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --only-verified
