name: Static Site CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify HTML files
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          files = list(Path('.').glob('*.html'))
          if not files:
              raise SystemExit('No HTML files found')
          for path in files:
              parser = Parser()
              parser.feed(path.read_text(encoding='utf-8'))
              parser.close()
              print(f'validated {path}')
          PY
      - name: Check internal file references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ('href','src'):
                      if key in d: self.refs.append(d[key])

          missing=[]
          for page in Path('.').glob('*.html'):
              p=Links(); p.feed(page.read_text(encoding='utf-8'))
              for ref in p.refs:
                  if not ref or ref.startswith(('#','mailto:','tel:','http://','https://','data:','javascript:')):
                      continue
                  target=urlsplit(ref).path
                  if target.startswith('/'):
                      target=target[1:]
                  if target and not Path(target).exists():
                      missing.append(f'{page}: {ref}')
          if missing:
              raise SystemExit('Missing local references:\n'+'\n'.join(missing))
          PY

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --only-verified --fail
